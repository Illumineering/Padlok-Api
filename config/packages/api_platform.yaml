api_platform:
  title: Padlok API
  version: '%env(string:API_VERSION)%'
  show_webby: false
  mapping:
    paths:
      - '%kernel.project_dir%/src/Entity'
      - '%kernel.project_dir%/src/ApiPlatform/Dto'
  formats:
    json: ['application/json']
    #jsonld: ['application/ld+json']
  docs_formats:
    #jsonld: ['application/ld+json']
    jsonopenapi: ['application/vnd.openapi+json']
    html: ['text/html']
  error_formats:
    jsonproblem: ['application/problem+json']
    json: ['application/problem+json', 'application/json']
  defaults:
    stateless: true
    cache_headers:
      vary: ['Content-Type', 'Authorization', 'Origin']

  enable_docs: '%env(bool:APP_DEBUG)%'
  enable_swagger: '%env(bool:SWAGGER_ENABLED)%'
  enable_swagger_ui: '%env(bool:SWAGGER_ENABLED)%'
  name_converter: 'Symfony\Component\Serializer\NameConverter\CamelCaseToSnakeCaseNameConverter'

when@prod:
  api_platform:
    # The entrypoint route (/{index}.{_format}) also catches probes like /.env, and fails rendering them
    enable_entrypoint: false
